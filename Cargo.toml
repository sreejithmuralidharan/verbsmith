[workspace]
resolver = "2"
members = [
  "crates/verbsmith-core",
  "crates/verbsmith-cli",
  "crates/verbsmith-server",
  "crates/verbsmith-wasm",
]
default-members = ["crates/verbsmith-cli"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Sreejith Muralidharan"]
repository = "https://github.com/sreejithmuralidharan/verbsmith"
homepage = "https://sreejith.co.uk"
readme = "README.md"

[workspace.dependencies]
age = "0.12"
anyhow = "1.0"
assert_cmd = "2.1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.3"
curl = { version = "0.4.50", default-features = false, features = ["ssl", "static-curl", "static-ssl", "http2", "ntlm", "spnego"] }
crossterm = "0.29"
directories = "6.0"
glob = "0.3"
http = "1.3"
indexmap = { version = "2.11", features = ["serde"] }
keyring = "4.2"
owo-colors = { version = "4.2", features = ["supports-colors"] }
ratatui = "0.30"
regex = "1.11"
rpassword = "7.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3.22"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
