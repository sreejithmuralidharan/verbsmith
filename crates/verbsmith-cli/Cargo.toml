[package]
name = "verbsmith"
description = "A local-first terminal workspace for building and testing APIs"
keywords = ["http", "api", "testing", "terminal", "curl"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "verbsmith"
path = "src/main.rs"

[dependencies]
age.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
crossterm.workspace = true
curl.workspace = true
glob.workspace = true
keyring.workspace = true
owo-colors.workspace = true
ratatui.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
verbsmith-core = { version = "0.1.0-alpha.1", path = "../verbsmith-core" }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
